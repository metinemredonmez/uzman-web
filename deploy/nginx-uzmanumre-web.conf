# /etc/nginx/sites-available/uzmanumre-web
# Kanonik alan: uzmanumre.com — www.* buraya 301 döner.
# Sertifika: mevcut /etc/letsencrypt/live/uzmanumre.com-0002/ (www'yu kapsayacak
# şekilde genişletilmeli: certbot certonly --nginx --cert-name uzmanumre.com
#   -d uzmanumre.com -d www.uzmanumre.com)
# DİKKAT: api. / admin. / fly. / mail-panel. subdomain'leri kendi
# vhost'larında — dokunma.
#
# uzmanumre.com.tr: DNS şu an 185.106.208.2'de (Turhost). A kaydı
# 89.252.179.99'a çevrilince alttaki YORUMLU 443 bloğunu aç ve sertifikayı
# genişlet:
#   certbot certonly --nginx --cert-name uzmanumre.com \
#     -d uzmanumre.com -d www.uzmanumre.com \
#     -d uzmanumre.com.tr -d www.uzmanumre.com.tr

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name uzmanumre.com www.uzmanumre.com uzmanumre.com.tr www.uzmanumre.com.tr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://uzmanumre.com$request_uri;
    }
}

# www -> kanonik https://uzmanumre.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.uzmanumre.com;

    ssl_certificate /etc/letsencrypt/live/uzmanumre.com-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzmanumre.com-0002/privkey.pem;

    return 301 https://uzmanumre.com$request_uri;
}

# uzmanumre.com.tr DNS çevrilince aç:
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name uzmanumre.com.tr www.uzmanumre.com.tr;
#     ssl_certificate /etc/letsencrypt/live/uzmanumre.com-0002/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/uzmanumre.com-0002/privkey.pem;
#     return 301 https://uzmanumre.com$request_uri;
# }

# Kanonik site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uzmanumre.com;

    ssl_certificate /etc/letsencrypt/live/uzmanumre.com-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzmanumre.com-0002/privkey.pem;

    # Next.js statik dosyaları için uzun cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3302;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3302;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 7 MB'lık umre-rehberi.pdf vb. için
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
