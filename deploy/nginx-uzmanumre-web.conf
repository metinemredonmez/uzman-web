# /etc/nginx/sites-available/uzmanumre-web
# Kanonik alan: uzmanumre.com — www.* ve *.com.tr buraya 301 döner.
# DİKKAT: api.uzmanumre.com ve admin.uzmanumre.com mevcut "uzmanumre"
# vhost'unda tanımlı; bu dosya YALNIZCA kök alanları kapsar, onlara dokunmaz.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name uzmanumre.com www.uzmanumre.com uzmanumre.com.tr www.uzmanumre.com.tr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://uzmanumre.com$request_uri;
    }
}

# www + com.tr -> kanonik https://uzmanumre.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.uzmanumre.com uzmanumre.com.tr www.uzmanumre.com.tr;

    ssl_certificate /etc/letsencrypt/live/uzmanumre-web/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzmanumre-web/privkey.pem;

    return 301 https://uzmanumre.com$request_uri;
}

# Kanonik site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uzmanumre.com;

    ssl_certificate /etc/letsencrypt/live/uzmanumre-web/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzmanumre-web/privkey.pem;

    # Next.js statik dosyaları için uzun cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3302;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3302;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 7 MB'lık umre-rehberi.pdf vb. için
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
