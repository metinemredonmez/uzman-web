# LOKAL ortam — web + Postgres + Redis
# Prod'da Docker kullanılmaz (pm2/systemd + nginx, bkz. ../deploy/DEPLOY.md).
# DB ve Redis şu an site tarafından kullanılmıyor; ileride eklenecek admin/API için hazır.
#
# Kullanım (bu klasörden):
#   docker compose up -d          # hepsini başlat
#   docker compose up -d db redis # sadece db + redis
#   docker compose down           # durdur

name: uzmanumre

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3400:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://uzmanumre:uzmanumre_dev@db:5432/uzmanumre
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=uzmanumre
      - POSTGRES_PASSWORD=uzmanumre_dev
      - POSTGRES_DB=uzmanumre
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
